# EC2 프로덕션 환경용 Docker Compose 설정
# Jenkinsfile에서 사용됨
# .env.production 파일에서 환경 변수 로드
# RDS PostgreSQL 사용 (로컬 PostgreSQL 없음)

services:
  # ======================================
  # API 서버 (IdleRPG Backend)
  # ======================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idlerpg-api
    ports:
      - "5172:5172"      # HTTP
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5172"
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Port=${DB_PORT}"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Redis__Password: "${REDIS_PASSWORD}"
    env_file:
      - .env.production
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - idlerpg-network

  # ======================================
  # Redis (캐싱 및 세션 관리)
  # ======================================
  redis:
    image: redis:7-alpine
    container_name: idlerpg-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - idlerpg-network

  # pgAdmin은 디스크 공간 절약을 위해 제거
  # 필요시 Rider DB 툴 또는 psql 직접 사용

# ======================================
# 볼륨 정의
# ======================================
volumes:
  redis_data:
    driver: local

# ======================================
# 네트워크 정의
# ======================================
networks:
  idlerpg-network:
    driver: bridge
