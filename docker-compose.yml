version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: idlerpg-postgres
    environment:
      POSTGRES_DB: idlerpgdb
      POSTGRES_USER: gamedev
      POSTGRES_PASSWORD: dev123!
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - idlerpg-network
    command: >
      postgres
      -c ssl=off
      -c log_statement=all
      -c log_connections=on
      -c log_disconnections=on

  redis:
    image: redis:7-alpine
    container_name: idlerpg-redis
    ports:
      - "6379:6379"
    networks:
      - idlerpg-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idlerpg-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:7122;http://+:5172
      - ASPNETCORE_Kestrel__Certificates__Default__Password=dev123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=idlerpgdb;Username=gamedev;Password=dev123!
    ports:
      - "5172:5172"
      - "7122:7122"
    volumes:
      - ${USERPROFILE}\.aspnet\https:/https:ro
    depends_on:
      - postgres
      - redis
    networks:
      - idlerpg-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: idlerpg-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@idlerpg.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8082:80"
    depends_on:
      - postgres
    networks:
      - idlerpg-network

networks:
  idlerpg-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: